name: Deploy to EC2 (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ${{ secrets.EC2_PROD_USERNAME }}
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e  # Exit immediately if any command fails
            
            echo "📁 Navigating to project directory..."
            cd /home/ubuntu/ghar || { echo "❌ Failed to cd into /home/ubuntu/ghar"; exit 1; }
            
            echo "📥 Pulling latest code from main branch..."
            git fetch origin
            # WARNING: The following command will discard ALL local changes without backup.
            # This is intentional for deployment purposes. Do NOT run if you have uncommitted work you wish to keep.
            git reset --hard origin/main
            echo "✅ Code pulled successfully"
            
            echo "🔍 Checking current git status..."
            git log -1 --oneline
            
            echo "🛑 Stopping existing containers..."
            sudo docker-compose -f compose.yaml down || true
            echo "✅ Containers stopped"
            
            echo "🏗️ Building and starting containers..."
            sudo docker-compose -f compose.yaml up -d --build
            echo "✅ Containers started"
            
            echo "📊 Checking container status..."
            sudo docker-compose -f compose.yaml ps
            
            echo "📜 Showing last 20 lines of app logs..."
            sleep 5  # Wait for app to start
            sudo docker-compose -f compose.yaml logs --tail=20
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Production deployment completed successfully!"
